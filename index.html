.btn-rdv{
  position: fixed;

  background: #ff3b30;

  border: none;
  border-radius: 50px;

  font-weight: bold;
  cursor: pointer;

.btn-rdv:hover{
  background: #e60023;

}
body {

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  width: 90%;
  max-width: 350px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* Boutons plus compacts */
button {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin: 6px 0;
  color: white;
  font-weight: bold;

<script>

  const fullName = "mm";
  const phoneNumber = "+2132";
  const email = "mm@gmail.com"; // optionnel

  const btn = document.getElementById("addContactBtn");

  btn.addEventListener("click", () => {
    // Création du contenu vCard
    const vCard = `
BEGIN:VCARD
VERSION:3.0
FN:${fullName}
TEL;TYPE=CELL:${phoneNumber}
EMAIL:${email}
END:VCARD
    `.trim();

    // Création du blob et téléchargement
    const blob = new Blob([vCard], { type: "text/vcard" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "mm.vcf"; // le fichier que l'utilisateur va télécharger
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
</script>
