<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Suivez-nous</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 0;
      color: white;
      font-weight: bold;
    }

    .facebook { background: #1877f2; }
    .instagram { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af); }
    .tiktok { background: #010101; }
      .contact { background:#28a745; }
    .WhatsApp { background:#25D366; }
    .website { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); }
    .GoogleReview{
  background: linear-gradient(
    45deg,
    #4285F4,
    #34A853,
    #FBBC05,
    #EA4335
  );

}
.Phone{
  background:#34C759; /* Apple call green */

}
  </style>
</head>
<body>

  <div class="card">
    <h2>Suivez-nous !</h2>

    <button class="facebook" onclick="goLink('facebook')"><i class="fab fa-facebook-f"></i> Abonnez sur Facebook</button>
    <button class="instagram" onclick="goLink('instagram')"> <i class="fab fa-instagram"></i> Abonnez sur Instagram</button>
    <button class="tiktok" onclick="goLink('tiktok')"><i class="fab fa-tiktok"></i>  Abonnez sur TikTok</button> 
   <button class="WhatsApp"  onclick="goLink('watshapp')"> <i class="fab fa-whatsapp"></i>  WhatsApp </button>
   <button class="website"  onclick="goLink('website')">     <i class="fas fa-globe"></i>
  Vister nos Site Web </button>
<button class="Phone"id="addContactBtn">
  <i class="fas fa-phone"></i> Ajouter au téléphone
</button>

<button class="GoogleReview" onclick="goLink('google')">
  <i class="fab fa-google"></i> Donner votre avis
</button>

  </div>

  <script>
    const links = {
      facebook: "https://facebook.com/TA.PAGE",
      instagram: "https://instagram.com/TA.PAGE",
      tiktok: "https://tiktok.com/@TA.PAGE",
      watshapp:"https://wa.me/+21652307723?text=Bonjour%20je%20souhaite%20plus%20d'informations",
      website :"",
      google:""
    };

    function goLink(platform) {
      window.open(links[platform], "_blank");
    }
  </script>

<script>
  // 👈 ici tu mets ton nom et numéro
  const fullName = "mm";
  const phoneNumber = "+2132";
  const email = "mm@gmail.com"; // optionnel

  const btn = document.getElementById("addContactBtn");

  btn.addEventListener("click", () => {
    // Création du contenu vCard
    const vCard = `
BEGIN:VCARD
VERSION:3.0
FN:${fullName}
TEL;TYPE=CELL:${phoneNumber}
EMAIL:${email}
END:VCARD
    `.trim();

    // Création du blob et téléchargement
    const blob = new Blob([vCard], { type: "text/vcard" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "mm.vcf"; // le fichier que l'utilisateur va télécharger
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
</script>
</body>
</html>
