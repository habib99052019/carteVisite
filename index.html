<!DOCTYPE html>

  <style>

  background: linear-gradient(
    45deg,

  );

}

     .profile-img {

</head>
<body>

  <div class="card">
    <img src="https://via.placeholder.com/120" alt="Dr. Emily Carter" class="profile-img">

    <h2>contactez-nous !</h2>
 <p class="company-name">Docteur Exemple</p>
    <button class="facebook" onclick="goLink('facebook')"><i class="fab fa-facebook-f"></i> Abonnez-vous sur Facebook</button>
    <button class="instagram" onclick="goLink('instagram')"> <i class="fab fa-instagram"></i> Abonnez-vous sur Instagram</button>
    <button class="tiktok" onclick="goLink('tiktok')"><i class="fab fa-tiktok"></i> Abonnez-vous sur  TikTok</button> 
   <button class="WhatsApp"  onclick="goLink('watshapp')"> <i class="fab fa-whatsapp"></i>  envoyer WhatsApp </button>
   <button class="website"  onclick="goLink('website')">     <i class="fas fa-globe"></i>
  Visiter notre site web </button>
    <button class="map" onclick="openMap()">      <i class="fa-solid fa-location-dot"></i>
 Nous localiser </button>
<button class="Phone"id="addContactBtn">
  <i class="fas fa-phone"></i> Ajouter au téléphone
</button>

<button class="GoogleReview" onclick="goLink('google')">
  <i class="fab fa-google"></i> Donner votre avis
</button>

  </div>

  <script>
    const links = {
      facebook: "https://www.facebook.com/AsfourSer",
      instagram: "https://www.instagram.com/performancedigitale/",
      tiktok: "https://tiktok.com/@TA.PAGE",
      watshapp:"https://wa.me/+21652307723?text=Bonjour%20je%20souhaite%20plus%20d'informations",
      website :"",
      google:""
    };

    function goLink(platform) {
      window.open(links[platform], "_blank");
    }
  </script>

<script>
  // 👈 ici tu mets ton nom et numéro
  const fullName = "mm";
  const phoneNumber = "+2132";
  const email = "mm@gmail.com"; // optionnel

  const btn = document.getElementById("addContactBtn");

  btn.addEventListener("click", () => {
    // Création du contenu vCard
    const vCard = `
BEGIN:VCARD
VERSION:3.0
FN:${fullName}
TEL;TYPE=CELL:${phoneNumber}
EMAIL:${email}
END:VCARD
    `.trim();

    // Création du blob et téléchargement
    const blob = new Blob([vCard], { type: "text/vcard" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "mm.vcf"; // le fichier que l'utilisateur va télécharger
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
</script>
<script>
  function openMap() {
    window.open(
      "https://www.google.com/maps?q=36.8065,10.1815",
      "_blank"
    );
  }
</script>
</body>
